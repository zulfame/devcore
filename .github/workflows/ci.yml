name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tes hook penjaga
        run: .claude/hooks/test-hooks.sh

      - name: Tes skrip pemeriksa
        run: scripts/test-scripts.sh

      - name: Periksa penamaan
        run: scripts/check-naming.sh

      - name: Periksa tautan dokumen
        run: scripts/check-links.sh

      - name: Deteksi pelemahan pemeriksaan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE_SHA"
          fi
          scripts/check-weakened-tests.sh "$base"
